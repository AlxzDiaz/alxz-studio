# Configuración de Netlify para alxz-studio (sitio estático, sin build).

# Cabeceras de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Tipografías: el nombre del archivo cambia con cada versión de Google, así que pueden guardarse un año
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos y capturas: 30 días (si cambias una imagen, cámbiale también el nombre)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

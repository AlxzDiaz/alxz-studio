  * { box-sizing: border-box; margin: 0; }

    min-height: 100vh; display: grid; place-items: center; padding: 24px;

  h1 em { color: var(--text-2); }
  p { margin-top: 14px; color: var(--text-2); }
  .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
  a {
    padding: 14px 24px; border: 1px solid rgba(232, 232, 232, .28); color: var(--white); text-decoration: none;
    font: 300 11.5px/1 'JetBrains Mono', monospace; letter-spacing: .24em; text-transform: uppercase;
  }
  a.solido { background: var(--red-accent); border-color: var(--red-accent); }
  a:hover { border-color: var(--red-accent); }
  a.solido:hover { background: var(--red); }
